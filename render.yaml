# Render blueprint — one web service serves the API and the web app from a
# single origin (https://<service>.onrender.com):
#   /api/*  → Express API      /*  → Expo web build (mobile/web-dist)
# Database: Supabase Postgres (DATABASE_URL). Set secrets in the dashboard.
services:
  - type: web
    name: clashgh
    runtime: node
    region: frankfurt          # closest Render region to Accra
    plan: starter
    rootDir: clashgh
    buildCommand: >
      npm ci --prefix backend &&
      npm ci --prefix mobile &&
      npm run web:export --prefix mobile
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    # Custom domain: add clashgh.app (and www) under Settings > Custom Domains,
    # then at your DNS provider create  A  @  -> 216.24.57.1  and
    # CNAME  www -> clashgh.onrender.com . Render issues TLS automatically.
    # SITE_ORIGIN below must match the domain (canonical URLs, sitemap, schema).
    # domains: uncomment once you have bought a domain and set SITE_ORIGIN to it
    # domains:
    #   - clashgh.app
    #   - www.clashgh.app
    autoDeploy: true
    branch: arena/01a0a65e-clashgh-app
    envVars:
      - key: SITE_ORIGIN
        sync: false            # leave EMPTY until you own a domain: the API then uses Render's own https URL
      - key: SITE_LEGAL_NAME
        sync: false            # registered business name shown in footer, terms, schema
      - key: SITE_CONTACT_EMAIL
        sync: false            # e.g. your Gmail for now
      - key: SITE_CONTACT_PHONE
        sync: false            # optional, E.164 (+233...), shown on /contact and used for WhatsApp
      - key: NODE_ENV
        value: production
      - key: WEB_DIST
        value: ../mobile/web-dist
      - key: AUTH_PROVIDER
        value: supabase
      - key: PAYSTACK_MODE
        value: live
      - key: SCREENSHOT_STORAGE
        value: cloudinary
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://hrfqgmvnoavyxpumjbad.supabase.co
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: PUSH_PROVIDER
        value: expo
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: ClashGH <onboarding@resend.dev>   # Resend's shared sender; switch to your domain later
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: https://clashgh-admin.onrender.com   # admin panel origin; change when you add a custom domain
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false            # signing cert fingerprints for /.well-known/assetlinks.json (see clashgh/RELEASE.md)
      # Baked into the web app at build time (npm run web:export). Must match the API.
      - key: EXPO_PUBLIC_API_URL
        value: /api          # same origin as the API, works on onrender.com and on a custom domain
      - key: EXPO_PUBLIC_AUTH_MODE
        value: supabase
      - key: EXPO_PUBLIC_PAYSTACK_MODE
        value: live
      - key: EXPO_PUBLIC_SUPABASE_URL
        value: https://hrfqgmvnoavyxpumjbad.supabase.co
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_Lmc0Pzrz9TBIICKVYPAQrA_sZABwgYe
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        value: 1095848345509-ke2or1o0tb0jkiqr5udcqi440gl59j80.apps.googleusercontent.com
      - key: EXPO_NO_TELEMETRY
        value: "1"

  # Admin panel: static Vite build, talks to the API above cross-origin.
  # URL will be https://clashgh-admin.onrender.com (matches CORS_ORIGINS above).
  - type: web
    name: clashgh-admin
    runtime: static
    rootDir: clashgh/admin
    branch: arena/01a0a65e-clashgh-app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://clashgh.onrender.com/api   # change to https://<your domain>/api once you have one
      - key: VITE_AUTH_MODE
        value: supabase
      - key: VITE_SUPABASE_URL
        value: https://hrfqgmvnoavyxpumjbad.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_Lmc0Pzrz9TBIICKVYPAQrA_sZABwgYe
